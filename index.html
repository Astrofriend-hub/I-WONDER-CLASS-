<meta charset="UTF-8">

<title>I Wonder 3 – Interactive English Class</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.5}

header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 22px;position:sticky;top:0;z-index:50}

.stat{background:rgba(255,255,255,.18);padding:6px 14px;border-radius:30px;font-weight:700}
.pbar{height:12px;background:rgba(255,255,255,.25);border-radius:20px;margin-top:10px;overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--green));transition:.5s}
button{cursor:pointer;border:none;font-family:inherit;transition:.15s}
.btn{background:var(--primary);color:#fff;padding:12px 24px;border-radius:30px;font-weight:700;box-shadow:var(--shadow)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn-accent{background:var(--accent)}.btn-green{background:var(--green)}.btn-yellow{background:var(--yellow);color:#5a4500}.btn-ghost{background:#e6ecff;color:var(--primary)}
.btn-sm{padding:8px 16px;font-size:.85rem}.btn-lg{padding:16px 40px;font-size:1.2rem}
.screen{display:none;animation:fade .4s}.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
#home{text-align:center;padding:60px 20px}
#home .e{font-size:5rem;animation:bounce 2s infinite}@keyframes bounce{50%{transform:translateY(-14px)}}
#home h2{font-size:2.4rem;color:var(--primary-dark);margin:10px 0}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
.obj{background:#fff8e1;border-left:6px solid var(--yellow);padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:600}
.atitle{font-size:1.25rem;font-weight:800;margin-bottom:6px}
.instr{color:var(--muted);margin-bottom:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{background:#eef2ff;border:3px solid transparent;padding:14px;border-radius:14px;font-weight:700;text-align:center}
.opt:hover{border-color:var(--primary)}.opt.correct{background:#d8f5f0;border-color:var(--green)}.opt.wrong{background:#ffe0ec;border-color:var(--accent)}
.fb{margin-top:12px;font-weight:800;min-height:24px}.fb.good{color:var(--green)}.fb.bad{color:var(--accent)}
.hint{background:#e6f7ff;border-radius:10px;padding:8px 14px;margin-top:10px;font-style:italic;color:#0077b6}
.flashg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.flash{background:linear-gradient(160deg,#fff,#eef2ff);border-radius:16px;padding:20px;text-align:center;border:3px solid #dce4ff}
.flash .em{font-size:3rem}.flash .w{font-size:1.3rem;font-weight:800;margin:6px 0}.flash .es{color:var(--accent);font-weight:600}
input[type=text]{width:100%;padding:12px;border:3px solid #dce4ff;border-radius:12px;font-size:1.05rem;margin-bottom:6px}
input:focus{outline:none;border-color:var(--primary)}
.mw{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{padding:14px;border-radius:12px;background:#eef2ff;font-weight:700;text-align:center;border:3px solid transparent}
.mi.sel{border-color:var(--primary);background:#dce4ff}.mi.matched{background:#d8f5f0;border-color:var(--green);opacity:.7}
.chip{background:var(--primary);color:#fff;padding:9px 15px;border-radius:18px;font-weight:700;cursor:pointer}
.slot,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:12px}
.slot{background:#fff8e1;border:3px dashed var(--yellow);margin-bottom:10px}.bank{background:#eef2ff}
.pagenav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}
.sidebar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.ppill{background:#eef2ff;padding:8px 14px;border-radius:12px;font-weight:700;cursor:pointer;border:2px solid transparent}
.ppill:hover,.ppill.cur{border-color:var(--primary);background:#dce4ff}
@media(max-width:640px){.mw{grid-template-columns:1fr}}
</style>

        words: [
          { emoji: "🏺", word: "pot", es: "vasija / maceta" },
          { emoji: "⚡", word: "crack", es: "grieta" },
          { emoji: "💧", word: "water", es: "agua" },
          { emoji: "🛣️", word: "road", es: "camino / carretera" }
        ]},
      { type: "quiz", instruction: "Understand the story:",
        question: "Why can't the old pot hold much water?", options: ["Because it's too big", "Because it's got a crack"], correct: 1 }
    ]

  {
    page: 37,
    title: "Wonder Tales 1 – The Cracked Pot (Part 2)",
    objective: "Understand the moral of the story",
    activities: [
      { type: "type", instruction: "Complete the summary word:",
        question: "The old pot waters the woman's ...", answer: "flowers", hint: "Beautiful colorful plants." },

/* ══════════════════════════════════════════════════════════════
   MOTOR — no necesitas tocar nada de aquí hacia abajo
   ══════════════════════════════════════════════════════════════ */

let cur=0, xp=0;
function addXP(n){xp+=n;document.getElementById('xp').textContent=xp;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0);}
function speak(t,r=1){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;speechSynthesis.speak(u);}
function start(){if(!BOOK_PAGES.length){alert('Add pages inside BOOK_PAGES first!');return;}buildSidebar();goPage(0);show('pageScreen');}

function buildSidebar(){
  const s=document.getElementById('sidebar');s.innerHTML='';
  BOOK_PAGES.forEach((p,i)=>{const b=document.createElement('div');b.className='ppill';b.textContent='Page '+p.page;b.onclick=()=>goPage(i);s.appendChild(b);});
}
function goPage(i){
  if(i<0||i>=BOOK_PAGES.length)return;
  cur=i;const p=BOOK_PAGES[i];
  document.getElementById('pageInd').textContent='Page '+p.page;
  document.getElementById('pageOf').textContent='Page '+(i+1)+' of '+BOOK_PAGES.length;
  document.getElementById('pfill').style.width=Math.round((i+1)/BOOK_PAGES.length*100)+'%';
  document.getElementById('prevBtn').style.visibility=i===0?'hidden':'visible';
  document.getElementById('nextBtn').style.visibility=i===BOOK_PAGES.length-1?'hidden':'visible';
  document.querySelectorAll('.ppill').forEach((b,bi)=>b.classList.toggle('cur',bi===i));
  const body=document.getElementById('pageBody');body.innerHTML='';
  const h=document.createElement('div');h.innerHTML=`<h2 style="color:var(--primary-dark)">📖 Page ${p.page} — ${p.title||''}</h2>`;body.appendChild(h);
  if(p.objective){const o=document.createElement('div');o.className='obj';o.textContent='🎯 '+p.objective;body.appendChild(o);}
  (p.activities||[]).forEach((a,ai)=>body.appendChild(renderActivity(a,ai+1)));
}

function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/`/g,'').replace(/'/g,"\\'");}

function renderActivity(a,num){
  const c=document.createElement('div');c.className='card';
  const head=`<div class="atitle">Activity ${num}</div><div class="instr">${a.instruction||''}</div>`;

  if(a.type==='flashcards'){
    c.innerHTML=head+`<div class="flashg"></div>`;
    const g=c.querySelector('.flashg');
    a.words.forEach(w=>{const d=document.createElement('div');d.className='flash';
      d.innerHTML=`<div class="em">${w.emoji||'📄'}</div><div class="w">${w.word}</div><div class="es">${w.es||''}</div>
      <button class="btn btn-sm btn-green" onclick="speak('${esc(w.word)}')">🔊</button>
      <button class="btn btn-sm btn-yellow" onclick="speak('${esc(w.word)}',.6)">🐢</button>`;g.appendChild(d);});
  }

  else if(a.type==='quiz'){
    c.innerHTML=head+`<b>${a.question||''}</b><div class="opts"></div><div class="hint hidden">💡 ${a.hint||''}</div><div class="fb"></div>`;
    const o=c.querySelector('.opts');
    a.options.forEach((op,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=op;
      b.onclick=()=>{const fb=c.querySelector('.fb');
        if(i===a.correct){b.classList.add('correct');fb.textContent='✅ Correct! +10 XP';fb.className='fb good';addXP(10);o.querySelectorAll('.opt').forEach(x=>x.disabled=true);}
        else{b.classList.add('wrong');fb.textContent='❌ Try again!';fb.className='fb bad';c.querySelector('.hint').classList.remove('hidden');}};
      o.appendChild(b);});
  }

  else if(a.type==='match'){
    c.innerHTML=head+`<div class="fb"></div><div class="mw"><div class="mcol L"></div><div class="mcol R"></div></div>`;
    const L=c.querySelector('.L'),R=c.querySelector('.R');let sel=null,done=0;
    const sh=[...a.pairs].sort(()=>Math.random()-.5);
    a.pairs.forEach((p,i)=>{const e=document.createElement('div');e.className='mi';e.textContent=p.word;e.dataset.k=i;e.onclick=()=>pick(e,'w');L.appendChild(e);});
    sh.forEach(p=>{const e=document.createElement('div');e.className='mi';e.innerHTML='<span style="font-size:2rem">'+p.emoji+'</span>';e.dataset.k=a.pairs.indexOf(p);e.onclick=()=>pick(e,'e');R.appendChild(e);});
    function pick(el,t){if(el.classList.contains('matched'))return;
      if(!sel){sel={el,t,k:el.dataset.k};el.classList.add('sel');return;}
      if(sel.t===t){sel.el.classList.remove('sel');sel={el,t,k:el.dataset.k};el.classList.add('sel');return;}
      if(sel.k===el.dataset.k){sel.el.classList.remove('sel');sel.el.classList.add('matched');el.classList.add('matched');done++;addXP(5);
        if(done===a.pairs.length){c.querySelector('.fb').textContent='🎉 All matched!';c.querySelector('.fb').className='fb good';}}
      else{el.classList.add('wrong');sel.el.classList.add('wrong');const s=sel;setTimeout(()=>{el.classList.remove('wrong','sel');s.el.classList.remove('wrong','sel');},600);}
      sel=null;}
  }

  else if(a.type==='type'){
    c.innerHTML=head+`<b>${a.question||''}</b><br><br><input type="text" placeholder="Type here..."><br><button class="btn btn-sm btn-green">✅ Check</button> <button class="btn btn-sm btn-yellow lst">🔊</button><div class="hint hidden">💡 ${a.hint||''}</div><div class="fb"></div>`;
    const inp=c.querySelector('input');c.querySelector('.lst').onclick=()=>speak(a.answer);
    c.querySelector('.btn-green').onclick=()=>{const fb=c.querySelector('.fb');
      if(inp.value.trim().toLowerCase()===String(a.answer).toLowerCase()){fb.textContent='✅ Correct! +10 XP';fb.className='fb good';addXP(10);}
      else{fb.textContent='❌ Try again!';fb.className='fb bad';c.querySelector('.hint').classList.remove('hidden');}};
  }

  else if(a.type==='build'){
    c.innerHTML=head+`<div class="slot"></div><div class="bank"></div><br><button class="btn btn-sm btn-green ck">✅ Check</button> <button class="btn btn-sm btn-ghost cl">🗑️ Clear</button><div class="fb"></div>`;
    const slot=c.querySelector('.slot'),bank=c.querySelector('.bank');
    [...a.words].sort(()=>Math.random()-.5).forEach(w=>{const s=document.createElement('span');s.className='chip';s.textContent=w;s.onclick=()=>slot.appendChild(s);bank.appendChild(s);});
    c.querySelector('.cl').onclick=()=>[...slot.children].forEach(x=>bank.appendChild(x));
    c.querySelector('.ck').onclick=()=>{const built=[...slot.children].map(x=>x.textContent).join(' ');const fb=c.querySelector('.fb');
      if(built===a.correct){fb.textContent='✅ Perfect! +10 XP';fb.className='fb good';addXP(10);speak(a.correct);}
      else{fb.textContent='❌ Not yet!';fb.className='fb bad';speak(a.correct,.7);}};
  }

  else if(a.type==='speaking'){
    c.innerHTML=head+`<p style="font-size:1.3rem;text-align:center;margin:14px 0">"${a.question||''}"</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-yellow mdl">🔊 Hear Model</button>
      <button class="btn btn-green rdy">🎤 I'm ready</button>
      <button class="btn btn-ghost gd">👍 Good</button>
    </div>`;
    c.querySelector('.mdl').onclick=()=>speak(a.model);
    c.querySelector('.rdy').onclick=function(){addXP(30);this.textContent='⭐ Excellent! +30';};
    c.querySelector('.gd').onclick=()=>addXP(20);
  }

  else if(a.type==='text'){
    c.innerHTML=head+`<div style="font-size:1.1rem">${a.html||''}</div>`;
  }

  else{c.innerHTML=head+'<i>Unknown activity type.</i>';}
  return c;
}
</script>
